name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, ci-probe]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: burncloud/ci/.github/workflows/rust.yml@da561fc59bdfa8739d32d5ef7f315ee0c4f6591a
